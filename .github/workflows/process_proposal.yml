name: Instant Zero-Moderation Auto-Approve Guest Edit

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  auto-process:
    if: contains(github.event.issue.labels.*.name, 'guest-edit-proposal')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fetch Latest Remote Changes & Rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Process Proposal & Update Database
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/process_proposal.js

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Auto-Approved**: Your guest profile edit has been automatically processed, saved to the database, and deployed live to [hoyingwink.com](https://hoyingwink.com)!'
            });

      - name: Close Approved Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Commit & Push Updated Dataset (With Resilient Retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sampleData.js public/guests_template.csv headshots_manifest.json src/App.jsx
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-approve guest proposal #${{ github.event.issue.number }} [skip ci]"

          # Resilient push retry loop to prevent concurrent git lock failures
          SUCCESS=0
          for i in {1..5}; do
            echo "Attempt $i: Syncing remote and pushing..."
            git pull --rebase origin main || true
            if git push origin main; then
              SUCCESS=1
              echo "Push succeeded on attempt $i!"
              break
            fi
            echo "Push failed, waiting before retrying..."
            sleep $((RANDOM % 3 + 2))
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Failed to push proposal commit after 5 attempts."
            exit 1
          fi
