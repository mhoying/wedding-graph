<!DOCTYPE html>
<html>
<head>
    <title>Pixel-Perfect Face Picker</title>
    <style>
        body { font-family: sans-serif; background: #181820; color: #e0e0e0; padding: 20px; margin: 0; }
        .panel { background: #242430; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #383848; }
        .container { position: relative; display: inline-block; margin-top: 10px; }
        #canvas { border: 1px solid #444; cursor: crosshair; max-width: 90vw; max-height: 80vh; border-radius: 4px; }
        input[type="file"] { margin-bottom: 15px; font-size: 14px; background: #333; color: white; border: none; padding: 8px; border-radius: 4px; }
        .code { background: #111118; padding: 12px; color: #40ffb0; font-family: monospace; user-select: all; border-radius: 4px; border: 1px solid #282838; font-size: 13px; word-break: break-all; }
        .stats { font-size: 15px; font-weight: bold; color: #70b0ff; }
        h3 { margin-top: 0; color: #fff; }
    </style>
</head>
<body>

<div class="panel">
    <h3>Pixel-Perfect Headshot Coordinate Picker</h3>
    <input type="file" id="upload" accept="image/*">
    <p style="color: #aaa; margin-top: 0;"><i>Instructions: Click ONCE on the center of the face (nose bridge). Then click a SECOND time on the chin tip to set face height.</i></p>
    
    <p class="stats">Center X: <span id="cx" style="color:#fff;">-</span> | Center Y: <span id="cy" style="color:#fff;">-</span> | Face Height (px): <span id="fh" style="color:#fff;">-</span></p>
    
    <div class="code" id="cmd">Upload an uncropped raw image from raw_sources/ and click face...</div>
</div>

<div class="container">
    <canvas id="canvas"></canvas>
</div>

<script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let img = new Image();
    let fileName = "";
    
    let state = 0; // 0 = wait for center, 1 = wait for height
    let cx = 0, cy = 0, fh = 0;

    upload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileName = file.name;
        const url = URL.createObjectURL(file);
        img.src = url;
    });

    img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        state = 0;
        redraw();
    };

    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        
        if (state === 1 || state === 2) {
            // Draw Center Crosshair
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = Math.max(2, Math.round(canvas.width / 400));
            ctx.beginPath();
            ctx.moveTo(cx - 25, cy); ctx.lineTo(cx + 25, cy);
            ctx.moveTo(cx, cy - 25); ctx.lineTo(cx, cy + 25);
            ctx.stroke();
        }
        
        if (state === 2) {
            // Draw Target Crop Box Overlay
            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = Math.max(2, Math.round(canvas.width / 400));
            const boxSize = fh * (400 / 240);
            ctx.strokeRect(cx - boxSize / 2, cy - boxSize / 2, boxSize, boxSize);
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const rawX = Math.round((e.clientX - rect.left) * scaleX);
        const rawY = Math.round((e.clientY - rect.top) * scaleY);

        if (state === 0 || state === 2) {
            cx = rawX; cy = rawY;
            state = 1;
            document.getElementById('cx').innerText = cx;
            document.getElementById('cy').innerText = cy;
            document.getElementById('fh').innerText = "-";
            document.getElementById('cmd').innerText = "Now click on the chin tip to lock face height...";
        } else if (state === 1) {
            const radius = Math.abs(rawY - cy);
            fh = radius * 2;
            state = 2;
            document.getElementById('fh').innerText = fh;
            
            const guestId = fileName.replace(/__orig_media.*|\.jpg|\.png/g, '');
            const rawPathStr = `/home/mattie/vibe/wedding-graph/raw_sources/${fileName}`;
            const outStr = `/home/mattie/.gemini/antigravity/brain/d1d82195-9679-4831-841e-6a1401965558/review_${guestId}_bulletproof.jpg`;
            document.getElementById('cmd').innerText = `node scripts/utils/crop_headshot.js ${rawPathStr} ${cx} ${cy} ${fh} ${guestId} ${outStr}`;
        }
        redraw();
    });
</script>

</body>
</html>
